name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: contador-truco-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Solo al subir un tag tipo v0.1.0: publica el APK como Release de GitHub.
  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: contador-truco-apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-release.apk "contador-truco-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "contador-truco-${GITHUB_REF_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Contador de Truco ${GITHUB_REF_NAME}" \
            --notes "APK para instalar en Android. Bajalo desde el celular, abrilo y permití instalar apps desconocidas si Android lo pide."

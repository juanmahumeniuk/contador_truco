name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la release a publicar (ej. v0.1.0). Vacío = solo compilar.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: contador-truco-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Al subir un tag tipo v0.1.0, o al correr el workflow a mano con `release_tag`,
  # publica el APK como Release de GitHub (si el tag no existe, lo crea).
  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: contador-truco-apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mv app-release.apk "contador-truco-${TAG}.apk"
          gh release create "$TAG" "contador-truco-${TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Contador de Truco ${TAG}" \
            --notes "APK para instalar en Android. Bajalo desde el celular, abrilo y permití instalar apps desconocidas si Android lo pide."
